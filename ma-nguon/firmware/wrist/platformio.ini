; SafeWear wrist: ESP32-C3 SuperMini + MAX30102 (I2C GPIO0 SDA / GPIO1 SCL).
; Measures HR/SpO2 with the same MAX config, quality gate and Maxim algorithm
; as firmware/node (reused read-only from ../node) and broadcasts the result
; over BLE advertising (manufacturer data FF FF 'H' v1) for the chest board.
[platformio]
build_dir = ../../.cache/build/wrist
libdeps_dir = ../../.cache/libdeps/wrist

[env:wrist]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
