[platformio]
default_envs = gateway_lora
build_dir = ../../.cache/build/gateway
libdeps_dir = ../../.cache/libdeps/gateway

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:tools/pio_http_contract.py
lib_deps =
    jgromes/RadioLib@7.8.1
    bblanchon/ArduinoJson@6.21.5
build_flags =
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=0

[env:gateway_lora]
build_flags = ${env.build_flags} -DSAFEWEAR_WIRED_ONLY=0

[env:gateway_wired]
build_flags = ${env.build_flags} -DSAFEWEAR_WIRED_ONLY=1

[env:gateway_lora_http]
build_flags = ${env.build_flags} -DSAFEWEAR_WIRED_ONLY=0 -DSAFEWEAR_HTTP_ENABLED=1

[env:gateway_wired_http]
build_flags = ${env.build_flags} -DSAFEWEAR_WIRED_ONLY=1 -DSAFEWEAR_HTTP_ENABLED=1

[env:gateway_ppg_capture]
build_flags = ${env.build_flags} -DSAFEWEAR_WIRED_ONLY=1 -DSAFEWEAR_RAW_PPG=1
