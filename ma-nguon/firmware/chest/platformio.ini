; SafeWear chest: nRF52840 Pro Micro (nice!nano clone) + Ra-02 + MPU6050 + SOS
; button + buzzer. Reuses firmware/node core (frames, IMU features, fall, SOS
; button, journal record) read-only, receives wrist HR/SpO2 over BLE and sends
; protocol-v1 SNAPSHOT/EVENT frames with the gateway radio profile.
[platformio]
build_dir = ../../.cache/build/chest
libdeps_dir = ../../.cache/libdeps/chest

[env:chest]
platform = nordicnrf52@10.11.0
board = adafruit_feather_nrf52840
framework = arduino
monitor_speed = 115200
build_flags = -DSAFEWEAR_NODE_ID=1
lib_deps =
    jgromes/RadioLib@7.8.1
